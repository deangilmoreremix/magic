# Render Infrastructure-as-Code for the Magic monorepo.
#
# Deploys the full working stack EXCEPT the Sandbox Gateway, which needs a host
# Docker socket (unavailable on Render). Super Magic planning/LLM calls still run;
# only the code-execution sandbox is omitted.
#
# Magic's primary DB is MySQL (DB_DRIVER=mysql). Render has no managed MySQL, so we
# deploy a mysql:8.0 private service. Your Supabase project remains the EXTERNAL app
# Postgres (configured via SUPABASE_* in .env) and is untouched by this stack.
#
# Usage:
#   1. Push this repo to GitHub and connect it in the Render dashboard ("Blueprint").
#   2. Render reads this file and creates all services.
#   3. Set the secrets below (or use Render's "Secret Files"/env groups). The values
#      shown mirror .env; override the ones marked CHANGE-ME.
#   4. The web service is the public entrypoint (magic-web on :8080).

services:
  # ---------- Web (Node SSR server, public) ----------
  - type: web
    name: magic-web
    runtime: node
    plan: starter
    region: oregon
    rootDir: frontend/magic-web
    buildCommand: |
      npm install -g pnpm && pnpm install && pnpm build
    startCommand: node ./server/app.cjs
    envVars:
      - key: PORT
        value: "8080"
      - key: MAGIC_SERVICE_BASE_URL
        sync: false   # set to your magic-service onrender.com URL, e.g. https://magic-service-xxx.onrender.com
      - key: MAGIC_SOCKET_BASE_URL
        sync: false   # set to wss://<magic-service>.onrender.com (websocket port 9502)
      - key: MAGIC_EDITION
        value: open-source

  # ---------- API (PHP/Swoole, Docker) ----------
  - type: web
    name: magic-service
    runtime: docker
    plan: standard
    region: oregon
    rootDir: backend/magic-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: type
        value: main
      - key: APP_ENV
        value: prod
      - key: DB_DRIVER
        value: mysql
      - key: DB_HOST
        value: magic-mysql   # internal hostname of the mysql service below
      - key: DB_PORT
        value: "3306"
      - key: DB_USERNAME
        value: magic
      - key: DB_PASSWORD
        sync: false          # CHANGE-ME (use a strong password, not the example)
      - key: DB_DATABASE
        value: magic
      - key: REDIS_HOST
        value: magic-redis
      - key: REDIS_PASSWORD
        sync: false          # CHANGE-ME
      - key: AMQP_HOST
        value: magic-rabbitmq
      - key: AMQP_USER
        value: admin
      - key: AMQP_PASSWORD
        sync: false          # CHANGE-ME
      - key: AMQP_VHOST
        value: magic-chat
      - key: ODIN_QDRANT_BASE_URI
        value: http://magic-qdrant:6333
      - key: ODIN_QDRANT_API_KEY
        sync: false
      - key: MAGIC_SERVICE_BASE_URL
        sync: false          # set to this service's onrender.com URL
      - key: FILE_DRIVER
        value: local
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_CONNECTION_STRING
        sync: false

  # ---------- Daemon / cron worker (Docker) ----------
  - type: pservice
    name: magic-service-daemon
    runtime: docker
    plan: standard
    region: oregon
    rootDir: backend/magic-service
    dockerfilePath: ./Dockerfile
    envVars:
      - key: type
        value: daemon
      - key: CRONTAB_ENABLE
        value: "true"
      - key: DB_HOST
        value: magic-mysql
      - key: DB_USERNAME
        value: magic
      - key: DB_PASSWORD
        sync: false
      - key: DB_DATABASE
        value: magic
      - key: REDIS_HOST
        value: magic-redis
      - key: REDIS_PASSWORD
        sync: false
      - key: AMQP_HOST
        value: magic-rabbitmq
      - key: AMQP_USER
        value: admin
      - key: AMQP_PASSWORD
        sync: false

  # ---------- MySQL (Docker private service; Render has no managed MySQL) ----------
  - type: pservice
    name: magic-mysql
    runtime: docker
    plan: standard
    region: oregon
    dockerImage: mysql:8.0
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        sync: false          # CHANGE-ME
      - key: MYSQL_USER
        value: magic
      - key: MYSQL_PASSWORD
        sync: false          # CHANGE-ME (must match magic-service DB_PASSWORD)
      - key: MYSQL_DATABASE
        value: magic
    disk:
      name: magic-mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10

  # ---------- Redis (managed) ----------
  - type: redis
    name: magic-redis
    plan: starter
    region: oregon
    ipAllowList: []

  # ---------- RabbitMQ (Docker private service) ----------
  - type: pservice
    name: magic-rabbitmq
    runtime: docker
    plan: starter
    region: oregon
    dockerImage: rabbitmq:4.1-management-alpine
    envVars:
      - key: RABBITMQ_DEFAULT_USER
        value: admin
      - key: RABBITMQ_DEFAULT_PASS
        sync: false          # CHANGE-ME (must match magic-service AMQP_PASSWORD)
      - key: RABBITMQ_DEFAULT_VHOST
        value: magic-chat

  # ---------- Qdrant (Docker private service) ----------
  - type: pservice
    name: magic-qdrant
    runtime: docker
    plan: starter
    region: oregon
    dockerImage: qdrant/qdrant:latest
    disk:
      name: magic-qdrant-data
      mountPath: /qdrant/storage
      sizeGB: 10

  # ---------- Super Magic (Docker; code-exec sandbox omitted) ----------
  - type: web
    name: super-magic
    runtime: docker
    plan: standard
    region: oregon
    dockerImage: ghcr.io/dtyq/super-magic:latest
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false          # CHANGE-ME (real key so Super Magic can call a model)
      - key: OPENAI_API_BASE_URL
        value: https://api.openai.com/v1
      - key: MAGIC_API_BASE_URL
        value: http://magic-service:9501/v1
      - key: QDRANT_COLLECTION_PREFIX
        value: SUPERMAGIC-
      - key: BROWSER_HEADLESS
        value: "True"

  # ---------- Magic Gateway (Docker) ----------
  - type: web
    name: magic-gateway
    runtime: docker
    plan: starter
    region: oregon
    dockerImage: ghcr.io/dtyq/magic-gateway:latest
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: MAGIC_API_BASE_URL
        value: http://magic-service:9501/v1
      - key: REDIS_PASSWORD
        sync: false
      - key: MAGIC_GATEWAY_PORT
        value: "8001"

# NOTE: Sandbox Gateway is intentionally excluded — it requires mounting the host
# Docker socket (unavailable on Render). Super Magic will run without live code exec.
