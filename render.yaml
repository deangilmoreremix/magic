services:
  - type: web
    name: magic-web
    runtime: docker
    plan: free
    region: oregon
    dockerContext: frontend/magic-web
    dockerfilePath: Dockerfile
    envVars:
      - key: MAGIC_SERVICE_BASE_URL
        sync: false
      - key: MAGIC_SOCKET_BASE_URL
        sync: false
      - key: MAGIC_EDITION
        value: open-source

  - type: web
    name: magic-service
    runtime: docker
    plan: starter
    region: oregon
    rootDir: backend/magic-service
    dockerfilePath: ./Dockerfile
    envVars:
      - key: type
        value: main
      - key: APP_ENV
        value: prod
      - key: DB_DRIVER
        value: mysql
      - key: DB_HOST
        value: magic-mysql
      - key: DB_PORT
        value: "3306"
      - key: DB_USERNAME
        value: magic
      - key: DB_PASSWORD
        sync: false
      - key: DB_DATABASE
        value: magic
      - key: REDIS_HOST
        value: magic-redis
      - key: REDIS_PASSWORD
        sync: false
      - key: AMQP_HOST
        value: magic-rabbitmq
      - key: AMQP_USER
        value: admin
      - key: AMQP_PASSWORD
        sync: false
      - key: AMQP_VHOST
        value: magic-chat
      - key: ODIN_QDRANT_BASE_URI
        value: http://magic-qdrant:6333
      - key: ODIN_QDRANT_API_KEY
        sync: false
      - key: MAGIC_SERVICE_BASE_URL
        sync: false
      - key: FILE_DRIVER
        value: local
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_CONNECTION_STRING
        sync: false

  - type: pserv
    name: magic-mysql
    runtime: image
    plan: starter
    region: oregon
    image:
      url: mysql:8.0
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        sync: false
      - key: MYSQL_USER
        value: magic
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        value: magic
    disk:
      name: magic-mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10

  - type: redis
    name: magic-redis
    plan: starter
    region: oregon
    ipAllowList: []

  - type: pserv
    name: magic-rabbitmq
    runtime: image
    plan: starter
    region: oregon
    image:
      url: rabbitmq:4.1-management-alpine
    envVars:
      - key: RABBITMQ_DEFAULT_USER
        value: admin
      - key: RABBITMQ_DEFAULT_PASS
        sync: false
      - key: RABBITMQ_DEFAULT_VHOST
        value: magic-chat

  - type: pserv
    name: magic-qdrant
    runtime: image
    plan: starter
    region: oregon
    image:
      url: qdrant/qdrant:latest
    disk:
      name: magic-qdrant-data
      mountPath: /qdrant/storage
      sizeGB: 10
